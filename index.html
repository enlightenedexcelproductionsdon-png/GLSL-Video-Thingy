# GLSL Video Processing with Hue Shift and Rotation

<canvas id="videoCanvas"></canvas>
<video id="videoElement" src="your-video-file.mp4" autoplay loop></video>

<script>
  const canvas = document.getElementById('videoCanvas');
  const video = document.getElementById('videoElement');
  const gl = canvas.getContext('webgl');

  const vertexShaderSource = `
    attribute vec4 a_position;
    varying vec2 v_texCoord;
    void main() {
      gl_Position = a_position;
      v_texCoord = a_position.xy * 0.5 + 0.5;
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
    varying vec2 v_texCoord;
    uniform sampler2D u_texture;
    uniform float u_hueShift;
    uniform float u_rotation;

    vec3 hueShift(vec3 color, float shift) {
      float angle = shift * 3.14159265;
      float cosA = cos(angle);
      float sinA = sin(angle);
      mat3 hueMatrix = mat3(
        0.299 + cosA * 0.701 - sinA * 0.299, 0.587 + cosA * 0.587 + sinA * 0.413, 0.114 + cosA * 0.114 + sinA * -0.587,
        0.299 + cosA * -0.299 + sinA * -0.587, 0.587 + cosA * 0.413 + sinA * 0.587, 0.114 + cosA * 0.587 + sinA * 0.299,
        0.299 + cosA * -0.587 + sinA * 0.299, 0.587 + cosA * -0.587 + sinA * -0.587, 0.114 + cosA * 0.701 + sinA * 0.114
      );
      return clamp(hueMatrix * vec3(color.r, color.g, color.b), 0.0, 1.0);
    }

    void main() {
      vec4 color = texture2D(u_texture, v_texCoord);
      color.rgb = hueShift(color.rgb, u_hueShift);
      gl_FragColor = color;
    }
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    return shader;
  }

  function createProgram(gl, vertexShader, fragmentShader) {
    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    return program;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);
  const program = createProgram(gl, vertexShader, fragmentShader);

  gl.useProgram(program);
  const positionLocation = gl.getAttribLocation(program, "a_position");
  const textureLocation = gl.getUniformLocation(program, "u_texture");
  const hueShiftLocation = gl.getUniformLocation(program, "u_hueShift");

  const positionBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
    -1, -1,
     1, -1,
    -1,  1,
     1,  1,
  ]), gl.STATIC_DRAW);

  gl.enableVertexAttribArray(positionLocation);
  gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

  const videoTexture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, videoTexture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  function render() {
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindTexture(gl.TEXTURE_2D, videoTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
    gl.uniform1i(textureLocation, 0);
    gl.uniform1f(hueShiftLocation, 0.5); // Adjust hue shift value here
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }

  video.addEventListener('play', function() {
    render();
  });
</script>
